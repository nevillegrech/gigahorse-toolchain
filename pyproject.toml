[project]
name = "gigahorse-toolchain"
version = "0.1.0"
description = "A binary lifter (and related framework) from low-level EVM code to a higher-level function-based three-address representation, similar to LLVM IR or Jimple."
readme = "README.md"
requires-python = ">=3.13"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Neville Grech" },
    { name = "Yannis Smaragdakis" },
]
keywords = [
    "ethereum",
    "evm",
    "decompiler",
    "static-analysis",
    "smart-contracts",
    "datalog",
    "souffle",
]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]

# The core decompiler/toolchain (gigahorse.py, generatefacts, src/, clientlib/,
# clients/visualizeout.py) uses only the Python standard library — it has no
# third-party runtime dependencies. Optional features live under the extras below.
dependencies = []

[project.optional-dependencies]
# `tooling/directives.py`: Datalog directive parsing (lark) + interactive
# HTML graph visualisation of the analysis (pyvis).
tooling = [
    "lark>=1.1.9",
    "pyvis>=0.3.2",
]
# Graphviz-based (dot) output rendering, used by the visualisation Docker image.
viz = [
    "pydot>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/nevillegrech/gigahorse-toolchain"
Repository = "https://github.com/nevillegrech/gigahorse-toolchain.git"
Documentation = "https://github.com/nevillegrech/gigahorse-toolchain#readme"

# PEP 735 development dependency group — installed by `uv sync`, never published as
# an extra. Covers the test runner and the type checker exercised in CI.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-xdist>=3.8",
    "filelock>=3.15",
    "ruff>=0.15",
    "ty>=0.0.56,<0.1",
]

[tool.uv]
# Gigahorse is an application/toolchain executed in place (e.g. `./gigahorse.py`),
# not a distributable wheel. Tell uv to manage the environment only and not attempt
# to build & install the project itself (no build backend is defined on purpose).
package = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["test_gigahorse.py"]

# Astral's `ty` is the project's type checker. It replaces mypy: ty checks the
# bodies of un-annotated functions unconditionally (mypy needed check_untyped_defs
# for that, and skipped them by default), and it shares the ruff/uv toolchain the
# rest of the project already pins.
#
# Known gap vs the mypy config this replaced: ty has no equivalent of mypy's
# `strict_equality`, so a non-overlapping comparison such as `"a" == 3` is not
# reported (verified against ty 0.0.56 with every rule promoted to error).
#
# Off by default and left off for now — each needs a cleanup pass first:
#   possibly-unresolved-reference (4 hits in gigahorse.py), missing-type-argument
#   (5 hits), missing-override-decorator (31 hits).
[tool.ty.environment]
python-version = "3.13"
# clientlib/src are imported from the repo root (e.g. `clientlib.facts_to_cfg`);
# keep the root on the module search path so those first-party imports resolve.
root = ["."]

[tool.ty.src]
# Default targets when `ty check` is invoked without explicit paths. This tracks
# what ruff lints, so a file cannot be linted but silently left un-type-checked.
# `generatefacts` has a shebang and no .py suffix; ty reads it as Python anyway
# (ruff needs [tool.ruff] extend-include for the same reason).
include = [
    "gigahorse.py",
    "generatefacts",
    "clients/visualizeout.py",
    "src",
    "clientlib",
    "conftest.py",
    "test_gigahorse.py",
]
# Not yet covered: tooling/. compare-runs.py builds a heterogeneous `filemap`
# (str -> set | dict depending on the key), which needs restructuring before it
# type-checks, and directives.py imports lark/pyvis from the optional `tooling`
# extra, which CI does not install. To add it later, install the extra and:
#     [[tool.ty.overrides]]
#     include = ["tooling/**"]
#     [tool.ty.overrides.rules]
#     unresolved-import = "ignore"

[tool.ruff]
# Lint/format target matches the interpreter the rest of the toolchain pins.
target-version = "py313"
line-length = 100
# souffle-addon is a native (C++) submodule; nothing to lint there.
extend-exclude = ["souffle-addon"]
# `generatefacts` is a Python script with a shebang but no .py suffix; without this
# it escapes the lint gate entirely.
extend-include = ["generatefacts"]

[tool.ruff.lint]
# A pragmatic baseline for a working toolchain: real-bug and modernization rules,
# not whole-codebase stylistic churn (pathlib/print/security nits are intentionally
# left out for now — they'd rewrite large parts of a stdlib-only CLI).
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes — undefined names, unused imports/vars
    "I",       # isort — deterministic import ordering
    "UP",      # pyupgrade — modernize syntax for py313
    "B",       # flake8-bugbear — likely bugs & foot-guns
    "C4",      # flake8-comprehensions
    "PIE",     # flake8-pie — small cleanups
    "RUF",     # ruff-specific rules
]
ignore = [
    # Line length is a formatter concern; the formatter wraps code to 100 and long
    # strings / URLs / generated-Datalog literals are deliberately left intact.
    "E501",
    # `class X(str, Enum)` -> `StrEnum` changes member str() semantics, which would
    # alter emitted Datalog / comparisons. Tracked as a separate migration.
    "UP042",
    # Allow domain notation (e.g. the `×` multiplication sign in gas-cost comments).
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.isort]
# The toolchain runs in place (no installed package), and some modules under src/ are
# imported bare (e.g. `from tac_schema import ...`) because src/ is on sys.path at
# runtime — pin them as first-party so import grouping is stable.
known-first-party = [
    "src", "clientlib",
    "common", "runners", "exporter", "blockparse", "basicblock", "opcodes", "tac_schema",
]
